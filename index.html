<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ananya ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
}

.container{
    text-align:center;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,255,255,.5);
    color:white;
}

h1{
    font-size:40px;
}

h2{
    margin-top:20px;
    font-size:28px;
}

button{
    margin:20px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff1744;
    color:white;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:white;
    color:#ff1744;
    position:absolute;
}

.heart{
    position:absolute;
    color:red;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(1);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(2);
        opacity:0;
    }
}
</style>
</head>

<body>

<audio autoplay loop>
    <!-- Replace with your own music file -->
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>❤️ Welcome to Soham's Heart ❤️</h1>
    <h2>Ananya, Will You Be My Girlfriend? 💖</h2>

    <button id="yes">Yes ❤️</button>
    <button id="no">No 💔</button>
</div>

<script>
alert("❤️ Welcome to Soham's Heart ❤️");

const noBtn=document.getElementById("no");

function moveButton(){
    const x=Math.random()*(window.innerWidth-120);
    const y=Math.random()*(window.innerHeight-60);

    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

document.getElementById("yes").onclick=function(){
    document.body.innerHTML=`
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;
    flex-direction:column;background:linear-gradient(135deg,#ff4b6e,#ff9a9e);color:white;">
    <h1 style="font-size:60px;">YAY!! ❤️🥰</h1>
    <h2>Thank You Ananya!</h2>
    <h2>You just made Soham the happiest person alive! 💖</h2>
    <div style="font-size:100px;">❤️❤️❤️</div>
    </div>`;
}

// Floating Hearts
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);

},300);
</script>

</body>
</html>
